<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome Window Parker · Parked</title><link rel="icon" href="icons/parker-timer-32.png"><script src="theme.js"></script><link rel="stylesheet" href="ui.css"><script type="module" src="parked.js"></script></head>
<body class="parking-body"><main class="parked">
<p class="parked-state"><img class="parked-icon" src="icons/parker-timer-128.png" alt="" width="18" height="18">Window parked</p>
<h1 class="previous-title"><img class="favicon" id="favicon" alt="" width="20" height="20" hidden><span id="previous">Your previous tab</span></h1>
<button class="primary" id="restore" type="button">Restore tab</button>
<p class="hint" id="detail">Loading window details…</p><p class="hint quiet-note">Your tabs stay in this window.</p>
<p id="status" role="status" aria-live="polite"></p>
</main></body></html>
