<!doctype html>
<html lang="en" class="popup-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome Window Parker</title><link rel="icon" href="icons/parker-timer-32.png"><script src="theme.js"></script><link rel="stylesheet" href="ui.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header class="app-header"><img src="icons/parker-timer-128.png" width="28" height="28" alt=""><h1>Chrome Window Parker</h1></header>
<dl class="stats"><div><dt>Parked windows</dt><dd id="parkedCount">—</dd></div><div><dt>Sleeping tabs</dt><dd id="sleepingCount">—</dd></div></dl>
<p class="hint stats-help">Includes tabs put to sleep by Chrome.</p>
<div class="popup-actions"><button id="closeParked" disabled title="Returns parked windows to their normal tabs.">Clear parked tabs</button><button id="protect" disabled title="Protection lasts for this browser session.">Protect this tab</button><button id="toggle" disabled>Pause automatic parking</button></div>
<div class="popup-footer"><span id="mode" class="hint">Checking status…</span><div class="popup-links"><button class="text-button" id="support" type="button" aria-label="Support Chrome Window Parker on Buy Me a Coffee (opens in a new tab)" title="Support Chrome Window Parker on Buy Me a Coffee — opens in a new tab">Support</button><button class="text-button" id="options">Settings…</button></div></div>
<p id="status" role="status" aria-live="polite"></p></body></html>
