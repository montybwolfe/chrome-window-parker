<!doctype html>
<html lang="en" class="popup-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome Window Parker</title><link rel="icon" href="icons/parker-timer-32.png"><script src="theme.js"></script><link rel="stylesheet" href="ui.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header class="app-header"><img src="icons/parker-timer-128.png" width="28" height="28" alt=""><h1>Chrome Window Parker</h1></header>
<dl class="stats"><div><dt>Parked windows</dt><dd id="parkedCount">—</dd></div><div><dt>Sleeping tabs</dt><dd id="sleepingCount">—</dd></div></dl>
<p class="hint stats-help">Includes tabs put to sleep by Chrome.</p>
<div class="popup-actions"><button id="closeParked" disabled title="Returns parked windows to their normal tabs.">Clear parked tabs</button><button id="protect" disabled title="Protection lasts for this browser session.">Protect this tab</button><button id="toggle" disabled>Pause automatic parking</button></div>
<div class="popup-footer"><span id="mode" class="hint">Checking status…</span><div class="popup-links"><button class="icon-button" id="reportBug" type="button" aria-label="Report a bug on GitHub (opens in a new tab)" title="Report a bug"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.4a3 3 0 0 1 6 0"/><path d="M8 9h8a1 1 0 0 1 1 1v4a5 5 0 0 1-10 0v-4a1 1 0 0 1 1-1Z"/><path d="M12 12v7M7 12.5H4M17 12.5h3M7.5 16.5 5 18.5M16.5 16.5l2.5 2M7.4 10 5 8M16.6 10 19 8M10.2 4.6 9.2 3.2M13.8 4.6l1-1.4"/></svg></button><button class="text-button coffee-link" id="support" type="button" aria-label="Buy me a coffee (opens in a new tab)" title="Support Chrome Window Parker on Buy Me a Coffee"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10h11.5v4.25A5.75 5.75 0 0 1 10.25 20h0A5.75 5.75 0 0 1 4.5 14.25Z"/><path d="M16 11.5h1.25a2.75 2.75 0 0 1 0 5.5H16"/><path d="M8 6.5c.7-.6.7-1.4 0-2M11.75 6.5c.7-.6.7-1.4 0-2"/></svg><span>Buy me a coffee</span></button><button class="text-button" id="options">Settings…</button></div></div>
<p id="status" role="status" aria-live="polite"></p></body></html>
